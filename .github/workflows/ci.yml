name: CI

# Builds Soarcut and runs the unit tests on every pull request and on pushes to main.
# Needs no secrets: the app is built unsigned and the tests are ad-hoc signed.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: latest-stable

    - name: Build (Release)
      run: |
        set -o pipefail
        xcodebuild -project Flycut.xcodeproj -scheme Flycut -configuration Release \
          -derivedDataPath build/DerivedData build \
          CODE_SIGNING_ALLOWED=NO

    - name: Run unit tests (Address Sanitizer)
      run: |
        set -o pipefail
        xcodebuild -project Flycut.xcodeproj -scheme Flycut \
          -derivedDataPath build/DerivedData \
          -resultBundlePath build/TestResults.xcresult test \
          CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: TestResults
        path: build/TestResults.xcresult
